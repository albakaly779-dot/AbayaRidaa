name: Audit Integrity

on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-integrity
  cancel-in-progress: false

jobs:
  verify:
    name: Verify deployed audit chain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check --no-input requests

      - name: Verify chain and HMAC
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUDIT_HMAC_KEY_B64: ${{ secrets.AUDIT_HMAC_KEY_B64 }}
          AUDIT_TENANT_KEY: default
        run: python scripts/verify_audit_chain.py
